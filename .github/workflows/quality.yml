name: Quality checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done

      - name: Run logic tests
        run: node --test tests/*.test.cjs
