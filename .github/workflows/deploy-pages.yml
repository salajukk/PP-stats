name: Deploy production and preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Preview update signal
    types:
      - completed
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview-source

      - name: Check production JavaScript
        working-directory: production
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs

      - name: Check preview JavaScript
        working-directory: preview-source
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
          node --test tests/*.test.cjs

      - name: Build Pages site
        run: |
          mkdir -p site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude 'tests/' \
            production/ site/

          mkdir -p site/preview
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude 'tests/' \
            preview-source/ site/preview/

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
